# ~/.config/tmux/tmux.conf

# Remap prefix from 'C-b' to 'C-a' for better ergonomics
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse mode (scrolling, clicking, resizing)
set -g mouse on

# Split panes using | and - for horizontal and vertical
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Reload config file easily
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded."

# Vim-style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Minimalist Status Bar
set -g status-style bg=default,fg=cyan
set -g status-left-length 40
set -g status-left '#[fg=green,bold] ⏣ #S #[default]'
set -g status-right '#[fg=yellow]%H:%M #[fg=blue]%d-%b-%y '